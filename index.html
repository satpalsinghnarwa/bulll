        /* Logo */
        .logo-box {

            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ff00;
            background: #111;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Heading */
        .channel-name {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 10px;
            text-transform: uppercase;

        /* Subscribers */
        .subscribers {

        /* Description */
        .description {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* Button */
        .join-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 184px;
            height: 52px;
            padding: 0 28px;

            background: #2499df;
            color: #ffffff;
            text-decoration: none;

            border-radius: 28px;

            font-size: 17px;
            font-weight: 700;

            transition: all 0.25s ease;
        }

        .join-btn:hover {
            background: #1689cc;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(36,153,223,0.25);
        }

        .join-btn:active {
            transform: translateY(0);
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .telegram-card {
                max-width: 100%;
                padding: 35px 20px;
                border-radius: 18px;
            }

            .logo-box {
                width: 135px;

                margin-bottom: 22px;
            }

            .channel-name {
                font-size: 27px;
            }

            .subscribers {
                font-size: 17px;
                margin-bottom: 24px;
            }

            .description {
                font-size: 18px;
                margin-bottom: 30px;
            }

            .join-btn {
                width: 185px;
                height: 52px;
            }
        }

        @media (max-width: 380px) {

            .telegram-card {

                font-size: 24px;
